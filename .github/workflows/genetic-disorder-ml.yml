name: Genetic Disorder ML

on:
  push:
    paths:
      - "genetic-disorder-ml/**"
      - ".github/workflows/genetic-disorder-ml.yml"
  pull_request:
    paths:
      - "genetic-disorder-ml/**"
      - ".github/workflows/genetic-disorder-ml.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: genetic-disorder-ml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import package
        run: PYTHONPATH=src python -c "import genetic_disorder_ml; print(genetic_disorder_ml.__version__)"
